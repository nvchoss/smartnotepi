<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartNote Pi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e8e8e8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .main-container {
            display: flex;
            gap: 16px;
            width: 100%;
            max-width: 820px;
        }

        /* ===== PANEL IZQUIERDO ===== */
        .left-panel {
            flex: 1;
            border: 2px solid #bbb;
            border-radius: 8px;
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        .recording-bar {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .record-dot {
            width: 22px;
            height: 22px;
            background: #e83030;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2px solid #c52020;
        }

        .recording-text {
            flex: 1;
            font-size: 14px;
            color: #333;
        }

        .flag {
            font-size: 22px;
            line-height: 1;
        }

        .note-textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            margin: 10px;
            border-radius: 4px;
            resize: none;
            font-size: 13.5px;
            line-height: 1.65;
            color: #444;
            min-height: 220px;
            font-family: Arial, sans-serif;
        }

        .note-textarea:focus {
            outline: none;
            border-color: #999;
        }

        .save-bar {
            padding: 10px 12px 12px;
            border-top: 1px solid #e0e0e0;
        }

        .save-bar label {
            font-size: 12px;
            color: #666;
            display: block;
            margin-bottom: 6px;
        }

        .save-bar-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .title-input {
            flex: 1;
            padding: 5px 8px;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 13px;
            height: 28px;
        }

        .title-input:focus {
            outline: none;
            border-color: #888;
        }

        .btn {
            padding: 5px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            height: 28px;
        }

        .btn-guardar {
            background: #4a90d9;
            color: white;
        }

        .btn-limpiar {
            background: #999;
            color: white;
        }

        /* ===== PANEL DERECHO ===== */
        .right-panel {
            flex: 1;
            border: 2px solid #bbb;
            border-radius: 8px;
            background: #fff;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 12px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            border: 1px solid #bbb;
            border-radius: 20px;
            padding: 6px 14px;
            gap: 8px;
            background: #fff;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
        }

        .search-icon {
            color: #555;
            display: flex;
            align-items: center;
        }

        .search-icon svg {
            width: 17px;
            height: 17px;
        }

        .notes-list {
            list-style: none;
            display: flex;
            flex-direction: column;
        }

        .note-item {
            display: flex;
            align-items: center;
            padding: 7px 4px;
            border-bottom: 1px solid #ebebeb;
        }

        .note-item:last-child {
            border-bottom: none;
        }

        .note-name {
            flex: 1;
            font-size: 13.5px;
            color: #333;
        }

        .note-actions {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            width: 30px;
            height: 30px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        .action-btn svg {
            width: 15px;
            height: 15px;
        }

        .action-btn.view {
            border: 1px solid #98b4de;
            color: #4a75c0;
        }

        .action-btn.edit {
            border: 1px solid #98b4de;
            color: #4a75c0;
        }

        .action-btn.delete {
            border: 1px solid #e8a0a0;
            color: #cc4444;
            background: #fff5f5;
        }
    </style>
</head>
