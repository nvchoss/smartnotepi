<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartNote Pi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e8e8e8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .main-container {
            display: flex;
            gap: 16px;
            width: 100%;
            max-width: 820px;
        }

        /* ===== PANEL IZQUIERDO ===== */
        .left-panel {
            flex: 1;
            border: 2px solid #bbb;
            border-radius: 8px;
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        .recording-bar {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .record-btn {
            width: 34px;
            height: 34px;
            background: #e83030;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2px solid #c52020;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }

        .record-btn:hover {
            background: #cc2020;
            transform: scale(1.05);
        }

        .record-btn.recording {
            background: #e87a10;
            border-color: #c55e00;
            animation: pulse 1.2s infinite;
        }

        .record-btn svg {
            width: 16px;
            height: 16px;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(232, 122, 16, 0.5); }
            50%       { box-shadow: 0 0 0 6px rgba(232, 122, 16, 0); }
        }

        .recording-text {
            flex: 1;
            font-size: 14px;
            color: #333;
        }

        .recording-text.active {
            color: #e87a10;
            font-style: italic;
        }

        .lang-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 38px;
            border-radius: 7px;
            border: 2px solid transparent;
            cursor: pointer;
            flex-shrink: 0;
            gap: 1px;
            transition: transform 0.1s, box-shadow 0.15s;
        }

        .lang-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }

        .lang-btn.lang-us {
            background: #1a5fb4;
            border-color: #1046a0;
            color: white;
        }

        .lang-btn.lang-esp {
            background: #f5c200;
            border-color: #c99a00;
            color: #3a2800;
        }

        .lang-flag {
            font-size: 15px;
            line-height: 1;
        }

        .lang-code {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.8px;
        }

        .note-textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            margin: 10px;
            border-radius: 4px;
            resize: none;
            font-size: 13.5px;
            line-height: 1.65;
            color: #444;
            min-height: 220px;
            font-family: Arial, sans-serif;
        }

        .note-textarea[readonly] {
            background: #f7f7f7;
            cursor: default;
        }

        .note-textarea:focus {
            outline: none;
        }

        .save-bar {
            padding: 10px 12px 12px;
            border-top: 1px solid #e0e0e0;
        }

        .save-bar label {
            font-size: 12px;
            color: #666;
            display: block;
            margin-bottom: 6px;
        }

        .save-bar-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .title-input {
            flex: 1;
            padding: 5px 8px;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 13px;
            height: 28px;
        }

        .title-input:focus {
            outline: none;
            border-color: #888;
        }

        .btn {
            padding: 5px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            height: 28px;
        }

        .btn-guardar {
            background: #4a90d9;
            color: white;
        }

        .btn-limpiar {
            background: #999;
            color: white;
        }

        /* ===== PANEL DERECHO ===== */
        .right-panel {
            flex: 1;
            border: 2px solid #bbb;
            border-radius: 8px;
            background: #fff;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 12px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            border: 1px solid #bbb;
            border-radius: 20px;
            padding: 6px 14px;
            gap: 8px;
            background: #fff;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
        }

        .search-icon {
            color: #555;
            display: flex;
            align-items: center;
        }

        .search-icon svg {
            width: 17px;
            height: 17px;
        }

        .notes-list {
            list-style: none;
            display: flex;
            flex-direction: column;
        }

        .note-item {
            display: flex;
            align-items: center;
            padding: 7px 4px;
            border-bottom: 1px solid #ebebeb;
        }

        .note-item:last-child {
            border-bottom: none;
        }

        .note-name {
            flex: 1;
            font-size: 13.5px;
            color: #333;
        }

        .note-actions {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            width: 30px;
            height: 30px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        .action-btn svg {
            width: 15px;
            height: 15px;
        }

        .action-btn.view {
            border: 1px solid #98b4de;
            color: #4a75c0;
        }

        .action-btn.edit {
            border: 1px solid #98b4de;
            color: #4a75c0;
        }

        .action-btn.delete {
            border: 1px solid #e8a0a0;
            color: #cc4444;
            background: #fff5f5;
        }
    </style>
</head>

    <script>
        const recordBtn     = document.getElementById('recordBtn');
        const iconMic       = document.getElementById('iconMic');
        const iconPause     = document.getElementById('iconPause');
        const recordingText = document.getElementById('recordingText');
        const noteTextarea  = document.querySelector('.note-textarea');

        let isRecording = false;
        let finalTranscript = '';
        let currentLang = 'es-AR';

        // --- Toggle de idioma ---
        const langBtn = document.getElementById('langBtn');
        langBtn.addEventListener('click', () => {
            if (currentLang === 'es-AR') {
                currentLang = 'en-US';
                langBtn.className = 'lang-btn lang-us';
                langBtn.querySelector('.lang-flag').textContent = '🇺🇸';
                langBtn.querySelector('.lang-code').textContent = 'US';
            } else {
                currentLang = 'es-AR';
                langBtn.className = 'lang-btn lang-esp';
                langBtn.querySelector('.lang-flag').textContent = '🇪🇸';
                langBtn.querySelector('.lang-code').textContent = 'ESP';
            }
            if (recognition) recognition.lang = currentLang;
        });

        // --- Toggle visual (siempre funciona, independiente de la API) ---
        function showPauseIcon() {
            iconMic.style.display   = 'none';
            iconPause.style.display = 'block';
            recordBtn.classList.add('recording');
            recordBtn.title = 'Detener grabación';
            recordingText.textContent = 'Grabando...';
            recordingText.classList.add('active');
        }

        function showMicIcon() {
            iconMic.style.display   = 'block';
            iconPause.style.display = 'none';
            recordBtn.classList.remove('recording');
            recordBtn.title = 'Iniciar grabación';
            recordingText.textContent = 'Presioná el micrófono para grabar';
            recordingText.classList.remove('active');
        }

        // --- Reconocimiento de voz (opcional) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = currentLang;
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                noteTextarea.value = finalTranscript + interim;
            };

            recognition.onend = () => {
                if (isRecording) try { recognition.start(); } catch (_) {}
            };
        }

        // --- Click: primero toggle visual, después intenta la API ---
        recordBtn.addEventListener('click', () => {
            isRecording = !isRecording;

            if (isRecording) {
                showPauseIcon();
                if (recognition) {
                    finalTranscript = noteTextarea.value ? noteTextarea.value.trimEnd() + ' ' : '';
                    try { recognition.start(); } catch (_) {}
                }
            } else {
                showMicIcon();
                if (recognition) {
                    try { recognition.stop(); } catch (_) {}
                }
            }
        });
    </script>
</body>
</html>
