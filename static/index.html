<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartNote Pi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e8e8e8;
            display: flex;
            min-height: 100vh;
            padding: 16px;
        }

        .main-container {
            display: flex;
            gap: 12px;
            width: 100%;
            height: calc(100vh - 32px);
        }

        /* ===== PANEL IZQUIERDO ===== */
        .left-panel {
            flex: 0 0 calc(50% - 6px);
            border: 2px solid #bbb;
            border-radius: 8px;
            background: #fff;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .recording-bar {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .record-btn {
            width: 34px;
            height: 34px;
            background: #e83030;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2px solid #c52020;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }

        .record-btn:hover { background: #cc2020; transform: scale(1.05); }

        .record-btn.recording {
            background: #e87a10;
            border-color: #c55e00;
            animation: pulse 1.2s infinite;
        }

        .record-btn svg { width: 16px; height: 16px; }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(232, 122, 16, 0.5); }
            50%       { box-shadow: 0 0 0 6px rgba(232, 122, 16, 0); }
        }

        .recording-text { flex: 1; font-size: 14px; color: #333; }
        .recording-text.active { color: #e87a10; font-style: italic; }

        .lang-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 38px;
            border-radius: 7px;
            border: 2px solid transparent;
            cursor: pointer;
            flex-shrink: 0;
            gap: 1px;
            transition: transform 0.1s, box-shadow 0.15s;
        }

        .lang-btn:hover { transform: scale(1.06); box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
        .lang-btn.lang-us  { background: #1a5fb4; border-color: #1046a0; color: white; }
        .lang-btn.lang-esp { background: #f5c200; border-color: #c99a00; color: #3a2800; }
        .lang-flag { font-size: 15px; line-height: 1; }
        .lang-code { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; }

        .note-textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            margin: 10px;
            border-radius: 4px;
            resize: none;
            font-size: 13.5px;
            line-height: 1.65;
            color: #444;
            font-family: Arial, sans-serif;
            overflow-y: auto;
        }

        .note-textarea[readonly] { background: #f7f7f7; cursor: default; }
        .note-textarea:focus { outline: none; }

        .save-bar {
            padding: 10px 12px 12px;
            border-top: 1px solid #e0e0e0;
        }

        .save-bar label { font-size: 12px; color: #666; display: block; margin-bottom: 6px; }

        .save-bar-controls { display: flex; gap: 8px; align-items: center; }

        .title-input {
            flex: 1;
            padding: 5px 8px;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 13px;
            height: 28px;
        }

        .title-input:focus { outline: none; border-color: #888; }
        .title-input.error { border-color: #e83030; }

        .save-error {
            font-size: 11px;
            color: #e83030;
            margin-top: 5px;
            min-height: 16px;
        }

        .btn {
            padding: 5px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            height: 28px;
        }

        .btn-guardar { background: #4a90d9; color: white; }
        .btn-limpiar { background: #999; color: white; }

        /* ===== PANEL DERECHO ===== */
        .right-panel {
            flex: 0 0 calc(50% - 6px);
            border: 2px solid #bbb;
            border-radius: 8px;
            background: #fff;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 12px;
            height: 100%;
            overflow-y: auto;
        }

        .search-bar {
            display: flex;
            align-items: center;
            border: 1px solid #bbb;
            border-radius: 20px;
            padding: 6px 14px;
            gap: 8px;
            background: #fff;
            flex-shrink: 0;
        }

        .search-input { flex: 1; border: none; outline: none; font-size: 14px; }
        .search-icon { color: #555; display: flex; align-items: center; }
        .search-icon svg { width: 17px; height: 17px; }

        .notes-list { list-style: none; display: flex; flex-direction: column; }

        /* Card de nota */
        .note-item {
            display: flex;
            align-items: center;
            padding: 9px 4px;
            border-bottom: 1px solid #ebebeb;
            gap: 8px;
        }

        .note-item:last-child { border-bottom: none; }

        .note-info { flex: 1; min-width: 0; }

        .note-name {
            font-size: 13.5px;
            color: #333;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-meta {
            font-size: 11px;
            color: #aaa;
            margin-top: 2px;
            display: block;
        }

        .note-actions { display: flex; gap: 5px; flex-shrink: 0; }

        .action-btn {
            width: 30px;
            height: 30px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        .action-btn svg { width: 15px; height: 15px; }

        .action-btn.view     { border: 1px solid #98b4de; color: #4a75c0; }
        .action-btn.download { border: 1px solid #98b4de; color: #4a75c0; }

        .action-btn.delete {
            border: 1px solid #e8a0a0;
            color: #cc4444;
            background: #fff5f5;
        }

        .no-notas { font-size: 13px; color: #aaa; text-align: center; padding: 20px 0; }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open { display: flex; }

        .modal-box {
            background: #fff;
            border-radius: 10px;
            width: 560px;
            max-width: 90vw;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid #e0e0e0;
        }

        .modal-title { font-size: 15px; font-weight: bold; color: #333; }

        .modal-close {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #888;
            line-height: 1;
        }

        .modal-close:hover { color: #333; }

        .modal-meta { font-size: 11px; color: #aaa; padding: 6px 18px 0; }

        .modal-content {
            flex: 1;
            overflow-y: auto;
            padding: 14px 18px 18px;
            font-size: 13.5px;
            line-height: 1.7;
            color: #444;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="main-container">

        <!-- ===== PANEL IZQUIERDO ===== -->
        <div class="left-panel">
            <div class="recording-bar">
                <button id="recordBtn" class="record-btn" title="Iniciar grabación">
                    <svg id="iconMic" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="2" width="6" height="11" rx="3" fill="white" stroke="white"/>
                        <path d="M5 10a7 7 0 0014 0"/>
                        <line x1="12" y1="17" x2="12" y2="21"/>
                        <line x1="8"  y1="21" x2="16" y2="21"/>
                    </svg>
                    <svg id="iconPause" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="2" stroke-linecap="round" style="display:none;">
                        <rect x="6"  y="4" width="4" height="16" rx="1"/>
                        <rect x="14" y="4" width="4" height="16" rx="1"/>
                    </svg>
                </button>
                <span id="recordingText" class="recording-text">Presioná el micrófono para grabar</span>
                <button id="langBtn" class="lang-btn lang-esp" title="Cambiar idioma">
                    <span class="lang-flag">🇪🇸</span>
                    <span class="lang-code">ESP</span>
                </button>
            </div>

            <textarea id="noteTextarea" class="note-textarea" placeholder="El texto transcripto aparecerá aquí..." readonly></textarea>

            <div class="save-bar">
                <label>Título de la nota</label>
                <div class="save-bar-controls">
                    <input type="text" id="titleInput" class="title-input" placeholder="Sin título">
                    <button class="btn btn-guardar" id="btnGuardar">Guardar</button>
                    <button class="btn btn-limpiar" id="btnLimpiar">Limpiar</button>
                </div>
                <div class="save-error" id="saveError"></div>
            </div>
        </div>

        <!-- ===== PANEL DERECHO ===== -->
        <div class="right-panel">
            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar notas...">
                <span class="search-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"/>
                        <line x1="16.5" y1="16.5" x2="22" y2="22"/>
                    </svg>
                </span>
            </div>
            <ul class="notes-list" id="notesList"></ul>
        </div>

    </div>

    <!-- ===== MODAL VER NOTA ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle"></span>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-meta" id="modalMeta"></div>
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

    <script>
        // ===== GRABACIÓN =====
        const recordBtn     = document.getElementById('recordBtn');
        const iconMic       = document.getElementById('iconMic');
        const iconPause     = document.getElementById('iconPause');
        const recordingText = document.getElementById('recordingText');
        const noteTextarea  = document.getElementById('noteTextarea');

        let isRecording = false;
        let finalTranscript = '';
        let currentLang = 'es-AR';

        document.getElementById('langBtn').addEventListener('click', () => {
            if (currentLang === 'es-AR') {
                currentLang = 'en-US';
                langBtn.className = 'lang-btn lang-us';
                langBtn.querySelector('.lang-flag').textContent = '🇺🇸';
                langBtn.querySelector('.lang-code').textContent = 'US';
            } else {
                currentLang = 'es-AR';
                langBtn.className = 'lang-btn lang-esp';
                langBtn.querySelector('.lang-flag').textContent = '🇪🇸';
                langBtn.querySelector('.lang-code').textContent = 'ESP';
            }
            if (recognition) recognition.lang = currentLang;
        });

        const langBtn = document.getElementById('langBtn');

        function showPauseIcon() {
            iconMic.style.display   = 'none';
            iconPause.style.display = 'block';
            recordBtn.classList.add('recording');
            recordBtn.title = 'Detener grabación';
            recordingText.textContent = 'Grabando...';
            recordingText.classList.add('active');
        }

        function showMicIcon() {
            iconMic.style.display   = 'block';
            iconPause.style.display = 'none';
            recordBtn.classList.remove('recording');
            recordBtn.title = 'Iniciar grabación';
            recordingText.textContent = 'Presioná el micrófono para grabar';
            recordingText.classList.remove('active');
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = currentLang;
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                noteTextarea.value = finalTranscript + interim;
            };

            recognition.onerror = (event) => {
                if (event.error === 'not-allowed') {
                    recordingText.textContent = 'Permiso de micrófono denegado';
                    recordingText.classList.remove('active');
                    isRecording = false;
                    showMicIcon();
                }
            };

            recognition.onend = () => {
                if (isRecording) try { recognition.start(); } catch (_) {}
            };
        } else {
            recordingText.textContent = '❌ Tu navegador no soporta reconocimiento de voz. Usá Chrome.';
        }

        recordBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            if (isRecording) {
                showPauseIcon();
                if (recognition) {
                    finalTranscript = noteTextarea.value ? noteTextarea.value.trimEnd() + ' ' : '';
                    try { recognition.start(); } catch (_) {}
                }
            } else {
                showMicIcon();
                if (recognition) try { recognition.stop(); } catch (_) {}
            }
        });

        document.getElementById('btnLimpiar').addEventListener('click', () => {
            finalTranscript = '';
            noteTextarea.value = '';
            if (isRecording && recognition) {
                try { recognition.stop(); } catch (_) {}
                setTimeout(() => { try { recognition.start(); } catch (_) {} }, 100);
            }
        });

        // ===== NOTAS =====
        const notesList  = document.getElementById('notesList');
        const titleInput = document.getElementById('titleInput');
        const saveError  = document.getElementById('saveError');

        function wordCount(text) {
            return text.trim().split(/\s+/).filter(Boolean).length;
        }

        function renderNota(nota) {
            const li = document.createElement('li');
            li.className = 'note-item';
            li.dataset.id = nota.id;
            li.innerHTML = `
                <div class="note-info">
                    <span class="note-name">${nota.titulo}</span>
                    <span class="note-meta">${nota.fecha} · ${nota.palabras} ${nota.palabras === 1 ? 'palabra' : 'palabras'}</span>
                </div>
                <div class="note-actions">
                    <button class="action-btn view" title="Ver nota">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                    <button class="action-btn download" title="Descargar nota">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                    </button>
                    <button class="action-btn delete" title="Eliminar nota">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                            <path d="M10 11v6M14 11v6"/>
                            <path d="M9 6V4h6v2"/>
                        </svg>
                    </button>
                </div>`;

            li.querySelector('.view').addEventListener('click', () => verNota(nota.id));
            li.querySelector('.download').addEventListener('click', () => descargarNota(nota.id, nota.titulo));
            li.querySelector('.delete').addEventListener('click', () => borrarNota(nota.id, li));

            return li;
        }

        function actualizarListaVacia() {
            const items = notesList.querySelectorAll('.note-item');
            let placeholder = notesList.querySelector('.no-notas');
            if (items.length === 0) {
                if (!placeholder) {
                    placeholder = document.createElement('li');
                    placeholder.className = 'no-notas';
                    placeholder.textContent = 'No hay notas guardadas';
                    notesList.appendChild(placeholder);
                }
            } else if (placeholder) {
                placeholder.remove();
            }
        }

        async function cargarNotas() {
            const res = await fetch('/api/notas');
            const notas = await res.json();
            notesList.innerHTML = '';
            notas.forEach(n => notesList.appendChild(renderNota(n)));
            actualizarListaVacia();
        }

        // Guardar nota
        document.getElementById('btnGuardar').addEventListener('click', async () => {
            const titulo    = titleInput.value.trim();
            const contenido = noteTextarea.value.trim();

            saveError.textContent = '';
            titleInput.classList.remove('error');

            if (!titulo) {
                saveError.textContent = 'Escribí un título antes de guardar.';
                titleInput.classList.add('error');
                titleInput.focus();
                return;
            }
            if (!contenido) {
                saveError.textContent = 'No hay texto para guardar.';
                return;
            }

            const res = await fetch('/api/notas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ titulo, contenido })
            });

            if (res.status === 409) {
                saveError.textContent = 'Ya existe una nota con ese título.';
                titleInput.classList.add('error');
                titleInput.focus();
                return;
            }

            if (!res.ok) {
                saveError.textContent = 'Error al guardar. Intentá de nuevo.';
                return;
            }

            const nota = await res.json();
            notesList.insertBefore(renderNota(nota), notesList.firstChild);
            actualizarListaVacia();

            titleInput.value = '';
            finalTranscript = '';
            noteTextarea.value = '';
        });

        // Ver nota (modal)
        async function verNota(id) {
            const res  = await fetch(`/api/notas/${id}`);
            const nota = await res.json();
            document.getElementById('modalTitle').textContent   = nota.titulo;
            document.getElementById('modalMeta').textContent    = `${nota.fecha} · ${nota.palabras} ${nota.palabras === 1 ? 'palabra' : 'palabras'}`;
            document.getElementById('modalContent').textContent = nota.contenido;
            document.getElementById('modalOverlay').classList.add('open');
        }

        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('modalOverlay').classList.remove('open');
        });

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget)
                e.currentTarget.classList.remove('open');
        });

        // Descargar nota como .txt
        async function descargarNota(id, titulo) {
            const res  = await fetch(`/api/notas/${id}`);
            const nota = await res.json();
            const blob = new Blob([nota.contenido], { type: 'text/plain' });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href     = url;
            a.download = `${titulo}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Borrar nota
        async function borrarNota(id, li) {
            await fetch(`/api/notas/${id}`, { method: 'DELETE' });
            li.remove();
            actualizarListaVacia();
        }

        // Búsqueda en tiempo real
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            notesList.querySelectorAll('.note-item').forEach(li => {
                const nombre = li.querySelector('.note-name').textContent.toLowerCase();
                li.style.display = nombre.includes(q) ? '' : 'none';
            });
        });

        // Cargar notas al iniciar
        cargarNotas();
    </script>
</body>
</html>
